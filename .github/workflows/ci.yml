name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest tests/ -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check --select F,E9 src
      - run: ruff check src/dashaflow/_validation.py src/dashaflow/dasha.py src/dashaflow/errors.py src/dashaflow/vedic_calculator.py src/dashaflow/yoga.py src/dashaflow/matchmaking.py src/dashaflow/muhurtha.py src/dashaflow/career.py tests/test_validation.py tests/test_edgecases.py tests/test_production.py tests/test_units.py

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: rm -rf dist/ && python -m build
      - run: python -c "import zipfile,glob; ws=glob.glob('dist/*.whl'); assert ws, 'no wheel built in dist/'; assert 'dashaflow/py.typed' in zipfile.ZipFile(ws[0]).namelist(), 'py.typed missing from wheel'"
      - name: Check version/CHANGELOG consistency
        run: |
          python - <<'EOF'
          import re, pathlib
          src = pathlib.Path('src/dashaflow/_version.py').read_text()
          m = re.search(r'''__version__\s*=\s*["']([^"']+)["']''', src)
          assert m, 'could not parse _version.py'
          v = m.group(1)
          log = pathlib.Path('CHANGELOG.md').read_text()
          assert re.search(rf'^##\s+\[?{re.escape(v)}\]?(\s|-)', log, re.M), \
              f'CHANGELOG missing entry for {v}'
          EOF
