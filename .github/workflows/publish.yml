name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check --select F,E9 src
      - run: pytest tests/ -q

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install build
      - run: rm -rf dist/ && python -m build
      - run: python -c "import zipfile,glob; ws=glob.glob('dist/*.whl'); assert ws, 'no wheel built in dist/'; assert 'dashaflow/py.typed' in zipfile.ZipFile(ws[0]).namelist(), 'py.typed missing from wheel'"
      - name: Check version/CHANGELOG consistency
        run: |
          python - <<'EOF'
          import re, pathlib
          src = pathlib.Path('src/dashaflow/_version.py').read_text()
          m = re.search(r'''__version__\s*=\s*["']([^"']+)["']''', src)
          assert m, 'could not parse _version.py'
          v = m.group(1)
          log = pathlib.Path('CHANGELOG.md').read_text()
          assert re.search(rf'^##\s+\[?{re.escape(v)}\]?(\s|-)', log, re.M), \
              f'CHANGELOG missing entry for {v}'
          EOF
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
