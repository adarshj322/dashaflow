[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dashaflow"
dynamic = ["version"]
description = "Vedic astrology calculation engine — Swiss Ephemeris with Sidereal Lahiri ayanamsha"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE*"]
requires-python = ">=3.10"
authors = [
    { name = "Adarsh J" },
]
keywords = ["vedic", "astrology", "jyotish", "horoscope", "dashaflow", "vimshottari", "navamsha", "python", "python3", "swiss-ephemeris", "astrology-api", "pypi-package", "birth-chart", "jyotisha", "vedic-astrology", "jyotish-open-source"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Religion",
    "Typing :: Typed",
]
dependencies = [
    "pyswisseph>=2.10.3",
    "pytz>=2024.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0", "ruff>=0.8", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/adarshj322/dashaflow"
Repository = "https://github.com/adarshj322/dashaflow"
Documentation = "https://github.com/adarshj322/dashaflow#readme"
Changelog = "https://github.com/adarshj322/dashaflow/blob/main/CHANGELOG.md"
Issues = "https://github.com/adarshj322/dashaflow/issues"

[tool.hatch.version]
path = "src/dashaflow/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dashaflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "E701"]
